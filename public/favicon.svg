<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F9E8B"/>
      <stop offset="100%" stop-color="#556B2F"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#sageGrad)"/>
  <!-- Two overlapping organic circles representing two hearts finding their meeting point -->
  <circle cx="27" cy="32" r="14" fill="#F4F1EA" fill-opacity="0.75" />
  <circle cx="37" cy="32" r="14" fill="#FFFFFF" fill-opacity="0.85" />
  <!-- Center intersection subtle heart accent -->
  <circle cx="32" cy="32" r="4.5" fill="#556B2F" />
</svg>
